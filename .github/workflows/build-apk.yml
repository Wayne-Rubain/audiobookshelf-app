name: Build APK

on:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      # Fork test builds only: sign with a fixed debug key so each build can update the
      # installed test app in place. Fails if the secret is missing rather than
      # silently signing with a new random key.
      - name: install fixed debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/abs-debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:"
          echo "DEBUG_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: build Android app
        run: ./android/gradlew assembleDebug -p android --no-daemon

      # Fail the build unless the APK is really signed with the fixed debug key
      - name: verify APK signing key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee apk-certs.txt
          expected="577069c2fb9ebf883b529e4303c947d9c7a14a28ee97eba5cea5aa56df25d72c"
          if ! grep -qi "certificate SHA-256 digest: $expected" apk-certs.txt; then
            echo "::error::APK is not signed with the fixed debug key"
            exit 1
          fi
          if [ "$(grep -ci 'certificate SHA-256 digest' apk-certs.txt)" != "1" ]; then
            echo "::error::APK has more than one signer"
            exit 1
          fi

      - name: rename apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk
